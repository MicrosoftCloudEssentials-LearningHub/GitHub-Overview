site_name: GitHub Overview Hub
site_description: GitHub development, security, AI, automation, and platform guidance.
site_url: https://cloud2br-msftlearninghub.github.io/GitHub-Overview/
repo_url: https://github.com/Cloud2BR-MSFTLearningHub/GitHub-Overview
repo_name: Cloud2BR-MSFTLearningHub/GitHub-Overview
docs_dir: docs
site_dir: site
use_directory_urls: true
copyright: Copyright &copy; 2026 <a href="https://github.com/Cloud2BR-MSFTLearningHub" target="_blank" rel="noopener">Cloud2BR OSS - Learning Hub</a>

theme:
  name: material
  logo: https://avatars.githubusercontent.com/u/195347873?v=4
  favicon: https://avatars.githubusercontent.com/u/195347873?v=4
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: blue
    accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - assets/css/custom.css
extra_javascript:
  - assets/js/logo-link.js
  - assets/js/external-links.js
  - path: assets/js/mermaid.js
    type: module
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cloud2BR-MSFTLearningHub
      name: Cloud2BR OSS - Learning Hub

nav:
  - Home: index.md
  - Foundations:
      - Best practices: best-practices.md
      - GitHub Pages: demos/github-pages.md
      - GitHub Copilot licenses: demos/copilot-licenses.md
      - AI models: demos/ai-models.md
  - Platform and Delivery:
      - Repository size checks: demos/repository-size-checks.md
      - GitLab migration: demos/gitlab-migration.md
      - GitHub and Azure DevOps: demos/github-azure-devops.md
      - Pricing: demos/pricing.md
      - DevSecOps demo: demos/devsecops.md
      - CI/CD minimum access: demos/cicd-access.md
  - Security:
      - Defender for Cloud DevOps: demos/defender-devops.md